<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Khảo Thí AI - N8n</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-robot"></i> AutoGrade AI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="/"><i
                                class="bi bi-house-door"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'create' %}active{% endif %}" href="/create"><i
                                class="bi bi-magic"></i> Tạo Rubric Bằng AI</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'create_manual' %}active{% endif %} text-success"
                            href="/create-manual"><i class="bi bi-pencil-square"></i> Tạo Rubric Thủ Công</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'rubrics' %}active{% endif %}" href="/rubrics"><i
                                class="bi bi-folder2-open"></i> Quản Lý Rubrics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'exams' %}active{% endif %}" href="/exams"><i
                                class="bi bi-calendar-check"></i> Quản Lý Cuộc Thi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'grade_local' %}active{% endif %}"
                            href="/grade-local"><i class="bi bi-pc-display"></i> Chấm Local</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'grade_ai' %}active{% endif %}" href="/grade-ai"><i
                                class="bi bi-robot"></i> Chấm AI</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'results' %}active{% endif %}" href="/subject/word"><i
                                class="bi bi-bar-chart-line"></i> Kết Quả Chi Tiết</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}
    {% endblock %}
</body>

</html>
